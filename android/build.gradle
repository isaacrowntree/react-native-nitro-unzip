buildscript {
  ext.safeExtGet = {prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }

  repositories {
    mavenCentral()
    google()
  }
  dependencies {
    classpath("com.android.tools.build:gradle:8.2.1")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Nitrogen autolinking — adds generated Kotlin sources
apply from: '../nitrogen/generated/android/NitroUnzip+autolinking.gradle'
// Fix prefab discovery for sibling project dependencies (e.g. react-native-nitro-modules)
apply from: './fix-prefab.gradle'

android {
  namespace "com.margelo.nitro.unzip"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 21)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)

    externalNativeBuild {
      cmake {
        cppFlags "-O2 -frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared"
        abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
  }

  packagingOptions {
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libNitroModules.so",
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libfolly_json.so",
      "**/libfolly_runtime.so",
      "**/libglog.so",
      "**/libhermes.so",
      "**/libreactnative.so",
      "**/libreactnativejni.so",
      "**/libturbomodulejsijni.so",
      "**/libreact_nativemodule_core.so",
    ]
  }

  buildFeatures {
    prefab true
  }

  sourceSets {
    main {
      java.srcDirs += ['src/main/java']
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-android:+"
  implementation "com.facebook.react:react-native:+"
  implementation project(":react-native-nitro-modules")
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
  // zip4j — needed for password-protected zip/unzip (java.util.zip has no password API)
  implementation "net.lingala.zip4j:zip4j:2.11.5"
}
