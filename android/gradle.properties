# Toolchain pins. These are fallbacks only — a consuming React Native app that
# sets `rootProject.ext.<name>` wins (see getExtOrDefault in build.gradle), and
# in practice it usually does: Expo's root project supplies compileSdk 36 and
# ndk 27.1.12297006, which override the values below.
#
# kotlinVersion tracks react-native-nitro-modules 0.37 (2.1.21) rather than a
# newer release on purpose — react-native 0.86.2 resolves KGP 2.1.20, and
# kotlin-test-junit below must not drift ahead of the compiler actually used.
NitroUnzip_kotlinVersion=2.1.21
NitroUnzip_agpVersion=9.3.1
NitroUnzip_minSdkVersion=26
NitroUnzip_targetSdkVersion=36
NitroUnzip_compileSdkVersion=36
NitroUnzip_ndkVersion=29.0.14206865

# Kotlin/coroutines + zip4j versions, kept here so they are visible alongside
# the rest of the toolchain rather than buried in the dependencies block.
NitroUnzip_coroutinesVersion=1.11.0
NitroUnzip_zip4jVersion=2.11.6
