appId: com.isaactriptech.nitrounzipexample
name: Password-protected round trip
tags:
  - password
---
- launchApp:
    clearState: true
- tapOn: 'Password'

- extendedWaitUntil:
    visible:
      text: 'Created protected zip: 4 files'
    timeout: 30000

# REGRESSION GUARD (iOS): SSZipArchive's unzip progressHandler reports a
# ZERO-BASED entry index. Treating it as a count made this report one file
# fewer than were actually extracted — 0 for a single-entry archive — and
# suppressed every progress callback on this path, because neither
# `count == 1` nor `count == total` ever matched.
#
# The fixture deliberately contains a nested directory, so this also fails if
# the counter is driven by SSZipArchive's entry index (which includes directory
# placeholders) instead of by real files — that would report 5, not 4.
#
# Asserting the exact count is the point: 4 fails both on the original
# zero-based off-by-one (which reported 3) and on entry-vs-file counting.
- extendedWaitUntil:
    visible:
      text: 'Extracted 4 files in .*'
    timeout: 30000

# The final progress callback must fire, which it did not before the fix.
- assertVisible:
    text: '4/4 files.*100%'

# And the decrypted bytes must actually be correct.
- assertVisible: 'Verified content: "This is password-protected content!..."'
